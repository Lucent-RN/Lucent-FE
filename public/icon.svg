<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="planet" cx="34%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </radialGradient>
    <radialGradient id="sphere" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>
    <clipPath id="planet-clip">
      <circle cx="50" cy="50" r="24" />
    </clipPath>
    <clipPath id="back">
      <rect x="0" y="0" width="100" height="50" />
    </clipPath>
    <clipPath id="front">
      <rect x="0" y="50" width="100" height="50" />
    </clipPath>
  </defs>

  <!-- Far half of orbit ring (behind the planet) -->
  <g transform="rotate(-18 50 50)">
    <path
      d="M8 50 A42 14 0 0 1 92 50"
      fill="none"
      stroke="#22d3ee"
      stroke-opacity="0.45"
      stroke-width="3.6"
      stroke-linecap="round"
    />
    <g clip-path="url(#back)">
      <circle cx="92" cy="50" r="5.6" fill="url(#sphere)" />
    </g>
  </g>

  <!-- Central Planet -->
  <circle cx="50" cy="50" r="24" fill="url(#planet)" />

  <!-- Shading bands on planet surface -->
  <g clip-path="url(#planet-clip)">
    <path
      d="M20 38 C 36 32, 50 44, 80 36 L80 46 C 52 54, 40 42, 20 48 Z"
      fill="#a5f3fc"
      opacity="0.3"
    />
    <path
      d="M20 56 C 38 50, 52 62, 80 54 L80 62 C 54 70, 38 60, 20 66 Z"
      fill="#0e7490"
      opacity="0.38"
    />
  </g>

  <!-- Near half of orbit ring (in front of planet) -->
  <g transform="rotate(-18 50 50)">
    <path
      d="M92 50 A42 14 0 0 1 8 50"
      fill="none"
      stroke="#a5f3fc"
      stroke-width="4.8"
      stroke-linecap="round"
    />
    <g clip-path="url(#front)">
      <circle cx="92" cy="50" r="5.6" fill="url(#sphere)" />
    </g>
  </g>
</svg>

